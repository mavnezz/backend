# Lokale, prod-nahe Services. Die App läuft im Dev per `npm run start:dev` gegen
# diese Datenbank (DB_TYPE=postgres). Redis/Worker kommen später bei Bedarf dazu.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backend
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
